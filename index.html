<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ежедневник</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ежедневник">
  <meta name="theme-color" content="#121418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    
    <main id="tab-main" class="tab-content active">
      
      <header class="app-header">
        <div class="header-content">
          <div>
            <span class="date-badge" id="current-date-text">Сегодня</span>
            <h1 class="header-title">Мой Ежедневник</h1>
          </div>
          <button class="icon-btn" id="btn-export-data" title="Резервная копия">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
        </div>
      </header>

      <section class="section-container" id="section-tasks">
        <div class="section-header">
          <h2 class="section-title">Задачи</h2>
        </div>

        <div id="tasks-container">
          <div class="card input-row">
            <input type="text" id="task-input" placeholder="Новая задача..." autocomplete="off">
            <button class="action-btn" id="btn-add-task">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>

          <div id="tasks-list" class="items-list"></div>
        </div>
      </section>

      <section class="section-container" id="section-notes-hub" style="margin-bottom: 95px;">
        <div class="section-header">
          <h2 class="section-title">База знаний</h2>
          <div class="segmented-control" id="notes-category-control">
            <button class="seg-btn active" data-notes-tab="pinned">Заметки</button>
            <button class="seg-btn" data-notes-tab="car">Авто</button>
          </div>
        </div>

        <div id="notes-pinned-container" class="notes-subpane">
          <div class="pinned-top-bar">
            <button class="btn-outline" id="btn-add-smart-note">+ Добавить карточку</button>
          </div>
          <div class="pinned-notes-grid" id="pinned-notes-list"></div>
        </div>

        <div id="notes-car-container" class="notes-subpane" style="display: none;">
          <div class="card car-status-card">
            <div class="car-status-header">
              <div class="car-badge-title">
                <span class="emoji-icon">🚗</span>
                <div>
                  <h3>Бортовой журнал</h3>
                  <span class="text-sub">Техническое обслуживание</span>
                </div>
              </div>
              <button class="btn-text" id="btn-edit-oil-status">Изменить</button>
            </div>
            
            <div class="oil-status-box">
              <span class="oil-label">Замена масла:</span>
              <span class="oil-km text-success" id="car-oil-target-km">212 000 км</span>
            </div>
          </div>

          <div class="card car-entry-form-card" style="margin-top: 12px;">
            <div class="car-form-title">Новая запись</div>
            <div class="car-form-grid">
              <input type="text" id="car-log-mileage" placeholder="Пробег (напр. 212к)">
              <input type="date" id="car-log-date" class="date-input-full" title="Дата ТО">
            </div>
            <textarea id="car-log-works" placeholder="Выполненные работы..." rows="3"></textarea>
            <button class="btn-solid btn-success" id="btn-add-car-log" style="margin-top: 10px;">
              Добавить запись
            </button>
          </div>

          <div class="section-header" style="margin-top: 24px;">
            <h3 class="section-title">История</h3>
          </div>
          <div id="car-maintenance-list" class="car-logs-list"></div>
        </div>
      </section>
    </main>

    <main id="tab-schemes" class="tab-content">
      <header class="app-header">
        <div class="header-content">
          <div>
            <span class="date-badge">Проекты</span>
            <h1 class="header-title">Темки</h1>
          </div>
          <span class="scheme-count-badge" id="schemes-total-count">0</span>
        </div>
      </header>

      <section class="section-container">
        <div class="card scheme-add-card">
          <div class="scheme-form-main">
            <input type="text" id="scheme-title" placeholder="Название..." autocomplete="off">
          </div>
          <div class="scheme-form-meta-single">
            <input type="text" id="scheme-potential" placeholder="Цель / Потенциал" autocomplete="off">
          </div>
          <div class="scheme-form-desc">
            <textarea id="scheme-notes" placeholder="Заметки по реализации..." rows="3"></textarea>
          </div>
          <button class="btn-solid btn-primary" id="btn-add-scheme">
            Создать
          </button>
        </div>
      </section>

      <div class="weeks-carousel-wrapper">
        <div class="weeks-carousel" id="scheme-filter-pills">
          <button class="week-pill active" data-scheme-filter="all">Все</button>
          <button class="week-pill" data-scheme-filter="idea">Идеи</button>
          <button class="week-pill" data-scheme-filter="in_progress">В работе</button>
          <button class="week-pill" data-scheme-filter="launched">Запущено</button>
        </div>
      </div>

      <section class="section-container" style="margin-bottom: 95px;">
        <div id="schemes-items-list" class="schemes-grid"></div>
      </section>
    </main>

    <main id="tab-archive" class="tab-content">
      <header class="app-header">
        <h1 class="header-title">Архив</h1>
      </header>

      <div class="section-container" style="margin-bottom: 95px;">
        <div class="info-banner card">
          <span class="info-icon">🌙</span>
          <span>Завершенные дела уходят сюда каждую полночь.</span>
        </div>
        <div id="archive-tasks-list" class="archive-list"></div>
      </div>
    </main>

    <nav class="bottom-tabbar">
      <button class="tab-btn active" data-tab="tab-main">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Главная</span>
      </button>
      <button class="tab-btn" data-tab="tab-schemes">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
        <span>Темки</span>
      </button>
      <button class="tab-btn" data-tab="tab-archive">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path></svg>
        <span>Архив</span>
      </button>
    </nav>

    <div id="smart-note-modal" class="modal-overlay">
      <div class="modal-card card">
        <h3 class="modal-title" id="smart-note-modal-title">Карточка базы</h3>
        
        <div class="modal-field-grid-2">
          <div class="modal-field">
            <label>Иконка</label>
            <input type="text" id="sn-modal-icon" placeholder="📌">
          </div>
          <div class="modal-field">
            <label>Цвет</label>
            <select id="sn-modal-color" class="custom-select">
              <option value="badge-purple">Фиолетовый</option>
              <option value="badge-green">Зеленый</option>
              <option value="badge-blue">Синий</option>
              <option value="badge-orange">Оранжевый</option>
            </select>
          </div>
        </div>

        <div class="modal-field">
          <label>Заголовок</label>
          <input type="text" id="sn-modal-title" placeholder="Название...">
        </div>

        <div class="modal-field">
          <label>Метка</label>
          <input type="text" id="sn-modal-badge" placeholder="Текст метки">
        </div>

        <div class="modal-field">
          <label>Содержимое</label>
          <div class="note-editor-toolbar">
            <button type="button" class="toolbar-btn" data-cmd-modal="bold"><b>B</b></button>
            <button type="button" class="toolbar-btn" data-cmd-modal="italic"><i>I</i></button>
            <button type="button" class="toolbar-btn" data-cmd-modal="insertUnorderedList">•</button>
            <button type="button" class="toolbar-btn" data-cmd-modal="insertOrderedList">1.</button>
            <button type="button" class="toolbar-btn" data-cmd-modal="hilite">Выделить</button>
          </div>
          <div id="sn-modal-rich-content" class="rich-editor-box" contenteditable="true"></div>
        </div>

        <div class="modal-actions-between">
          <button class="btn-text text-danger" id="btn-delete-smart-note" style="display: none;">Удалить</button>
          <div style="display: flex; gap: 8px; margin-left: auto;">
            <button class="btn-outline" id="btn-close-sn-modal">Отмена</button>
            <button class="btn-solid btn-primary" id="btn-save-smart-note">Сохранить</button>
          </div>
        </div>
      </div>
    </div>

    <div id="scheme-modal" class="modal-overlay">
      <div class="modal-card card">
        <h3 class="modal-title">Настройки темки</h3>
        <div class="modal-field">
          <label>Название</label>
          <input type="text" id="modal-scheme-title" placeholder="Купить электровелик...">
        </div>
        <div class="modal-field">
          <label>Цель</label>
          <input type="text" id="modal-scheme-potential" placeholder="Ожидаемый результат">
        </div>
        <div class="modal-field">
          <label>Статус</label>
          <select id="modal-scheme-status" class="custom-select">
            <option value="idea">Идея</option>
            <option value="in_progress">В работе</option>
            <option value="launched">Запущено</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Заметки</label>
          <textarea id="modal-scheme-notes" rows="4"></textarea>
        </div>
        <div class="modal-actions-between">
          <button class="btn-text text-danger" id="btn-delete-scheme-modal">Удалить</button>
          <div style="display: flex; gap: 8px; margin-left: auto;">
            <button class="btn-outline" id="btn-close-scheme-modal">Отмена</button>
            <button class="btn-solid btn-primary" id="btn-save-scheme-modal">Сохранить</button>
          </div>
        </div>
      </div>
    </div>

    <div id="car-oil-modal" class="modal-overlay">
      <div class="modal-card card">
        <h3 class="modal-title">Замена масла</h3>
        <div class="modal-field">
          <label>Пробег следующего ТО</label>
          <input type="text" id="modal-car-oil-input" placeholder="212 000 км">
        </div>
        <div class="modal-actions">
          <button class="btn-outline" id="btn-close-oil-modal">Отмена</button>
          <button class="btn-solid btn-success" id="btn-save-oil-modal">Сохранить</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
