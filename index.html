<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Дневник & Задачи</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: rgba(26, 29, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #8b949e;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 76px) 16px;
      overflow-x: hidden;
    }

    /* Верхний блок */
    header {
      padding: 16px 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header .date-display {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* Стеклянные карточки */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    /* Формы ввода */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input, textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    button.btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Список задач */
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .task-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .task-del-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }

    /* Заметки */
    .note-item {
      margin-bottom: 10px;
      position: relative;
    }

    .note-text {
      font-size: 0.95rem;
      white-space: pre-wrap;
      line-height: 1.4;
      word-break: break-word;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Долгосрок */
    .memo-item {
      margin-bottom: 12px;
      border-left: 3px solid var(--accent);
    }

    .memo-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .memo-body {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* Архив */
    .archive-group-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 16px 4px 8px;
    }

    .archive-item {
      opacity: 0.8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
    }

    .archive-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Нижний стеклянный бар навигации */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(58px + env(safe-area-inset-bottom, 16px));
      padding-bottom: env(safe-area-inset-bottom, 16px);
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      gap: 4px;
      cursor: pointer;
      width: 25%;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="date-display" id="currentDate"></div>
      <h1 id="tabTitle">Задачи на день</h1>
    </div>
  </header>

  <!-- ВКЛАДКА 1: ЗАДАЧИ -->
  <section id="tab-tasks" class="tab-content active">
    <div class="glass-card">
      <form id="taskForm" onsubmit="addTask(event)">
        <div class="input-row">
          <input type="text" id="taskText" placeholder="Что нужно сделать?" required>
        </div>
        <div class="input-row">
          <input type="time" id="taskTime" style="max-width: 140px;">
          <button type="submit" class="btn-primary" style="flex:1;">Добавить задачу</button>
        </div>
      </form>
    </div>
    <div class="glass-card" id="taskListContainer">
      <div id="taskList"></div>
    </div>
  </section>

  <!-- ВКЛАДКА 2: БЫСТРЫЕ ЗАМЕТКИ -->
  <section id="tab-notes" class="tab-content">
    <div class="glass-card">
      <form id="noteForm" onsubmit="addNote(event)">
        <textarea id="noteText" rows="2" placeholder="Заметка, номер телефона, список покупок..." required></textarea>
        <button type="submit" class="btn-primary" style="width: 100%; height: 42px; margin-top: 8px;">Сохранить запись</button>
      </form>
    </div>
    <div id="notesList"></div>
  </section>

  <!-- ВКЛАДКА 3: ПАМЯТКИ / ДОЛГОСРОК -->
  <section id="tab-memos" class="tab-content">
    <div class="glass-card">
      <form id="memoForm" onsubmit="addMemo(event)">
        <input type="text" id="memoTitle" placeholder="Заголовок (например: План по инвестициям)" required style="margin-bottom: 8px;">
        <textarea id="memoBody" rows="3" placeholder="Шаги, ориентиры, дедлайн, план действий..." required></textarea>
        <button type="submit" class="btn-primary" style="width: 100%; height: 42px; margin-top: 8px;">Закрепить памятку</button>
      </form>
    </div>
    <div id="memosList"></div>
  </section>

  <!-- ВКЛАДКА 4: АРХИВ -->
  <section id="tab-archive" class="tab-content">
    <div class="glass-card" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">
      Журнал завершенных дел. Здесь фиксируется дата закрытия каждой задачи без возможности случайного редактирования.
    </div>
    <div id="archiveList"></div>
  </section>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tasks', 'Задачи на день')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      План
    </button>
    <button class="nav-btn" onclick="switchTab('notes', 'Быстрые заметки')">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      Заметки
    </button>
    <button class="nav-btn" onclick="switchTab('memos', 'Памятки и долгосрок')">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      Памятки
    </button>
    <button class="nav-btn" onclick="switchTab('archive', 'Архив выполненного')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM8 15h8v2H8v-2zm0-4h8v2H8v-2zm0-4h8v2H8V7z"/></svg>
      Архив
    </button>
  </nav>

  <script>
    // Хранилище
    const DB = {
      get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val))
    };

    // Отображение текущей даты в заголовке
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString('ru-RU', {
      weekday: 'long', day: 'numeric', month: 'short'
    });

    // Переключение вкладок
    function switchTab(tabName, title) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('tabTitle').innerText = title;
      event.currentTarget.classList.add('active');

      if (tabName === 'archive') renderArchive();
    }

    // --- ЗАДАЧИ ---
    function renderTasks() {
      const tasks = DB.get('tasks');
      const list = document.getElementById('taskList');
      if (tasks.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size: 0.9rem; text-align:center; padding: 10px;">Нет активных задач</p>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <div class="task-item">
          <div class="custom-checkbox" onclick="completeTask('${t.id}')"></div>
          <div class="task-content">
            <div class="task-title">${t.text}</div>
            ${t.time ? `<div class="task-time">🕒 ${t.time}</div>` : ''}
          </div>
          <button class="task-del-btn" onclick="deleteTask('${t.id}')">✕</button>
        </div>
      `).join('');
    }

    function addTask(e) {
      e.preventDefault();
      const text = document.getElementById('taskText').value.trim();
      const time = document.getElementById('taskTime').value;
      if (!text) return;

      const tasks = DB.get('tasks');
      tasks.push({ id: Date.now().toString(), text, time, createdAt: new Date().toISOString() });
      DB.set('tasks', tasks);

      document.getElementById('taskText').value = '';
      document.getElementById('taskTime').value = '';
      renderTasks();
    }

    function deleteTask(id) {
      const tasks = DB.get('tasks').filter(t => t.id !== id);
      DB.set('tasks', tasks);
      renderTasks();
    }

    function completeTask(id) {
      const tasks = DB.get('tasks');
      const target = tasks.find(t => t.id === id);
      if (!target) return;

      // Убираем из активных
      DB.set('tasks', tasks.filter(t => t.id !== id));

      // Добавляем в архив с датой завершения
      const archive = DB.get('archive');
      archive.unshift({
        id: target.id,
        text: target.text,
        time: target.time,
        completedAt: new Date().toISOString()
      });
      DB.set('archive', archive);

      renderTasks();
    }

    // --- ЗАМЕТКИ ---
    function renderNotes() {
      const notes = DB.get('notes');
      const list = document.getElementById('notesList');
      if (notes.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size: 0.9rem; text-align:center;">Заметок пока нет</p>';
        return;
      }
      list.innerHTML = notes.map(n => `
        <div class="glass-card note-item">
          <div class="note-text">${n.text}</div>
          <div class="note-footer">
            <span>${new Date(n.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
            <button class="task-del-btn" onclick="deleteNote('${n.id}')">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    function addNote(e) {
      e.preventDefault();
      const text = document.getElementById('noteText').value.trim();
      if (!text) return;

      const notes = DB.get('notes');
      notes.unshift({ id: Date.now().toString(), text, date: new Date().toISOString() });
      DB.set('notes', notes);

      document.getElementById('noteText').value = '';
      renderNotes();
    }

    function deleteNote(id) {
      const notes = DB.get('notes').filter(n => n.id !== id);
      DB.set('notes', notes);
      renderNotes();
    }

    // --- ПАМЯТКИ ---
    function renderMemos() {
      const memos = DB.get('memos');
      const list = document.getElementById('memosList');
      if (memos.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size: 0.9rem; text-align:center;">Нет закрепленных памяток</p>';
        return;
      }
      list.innerHTML = memos.map(m => `
        <div class="glass-card memo-item">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="memo-title">${m.title}</div>
            <button class="task-del-btn" onclick="deleteMemo('${m.id}')">✕</button>
          </div>
          <div class="memo-body">${m.body}</div>
        </div>
      `).join('');
    }

    function addMemo(e) {
      e.preventDefault();
      const title = document.getElementById('memoTitle').value.trim();
      const body = document.getElementById('memoBody').value.trim();
      if (!title || !body) return;

      const memos = DB.get('memos');
      memos.unshift({ id: Date.now().toString(), title, body, date: new Date().toISOString() });
      DB.set('memos', memos);

      document.getElementById('memoTitle').value = '';
      document.getElementById('memoBody').value = '';
      renderMemos();
    }

    function deleteMemo(id) {
      const memos = DB.get('memos').filter(m => m.id !== id);
      DB.set('memos', memos);
      renderMemos();
    }

    // --- АРХИВ (ТОЛЬКО ДЛЯ ЧТЕНИЯ) ---
    function renderArchive() {
      const archive = DB.get('archive');
      const list = document.getElementById('archiveList');
      if (archive.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size: 0.9rem; text-align:center; padding: 20px;">Архив пуст</p>';
        return;
      }

      // Группировка по Месяц Год
      const groups = {};
      archive.forEach(item => {
        const d = new Date(item.completedAt);
        const groupKey = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        if (!groups[groupKey]) groups[groupKey] = [];
        groups[groupKey].push(item);
      });

      let html = '';
      for (const [groupName, items] of Object.entries(groups)) {
        html += `<div class="archive-group-title">${groupName}</div><div class="glass-card">`;
        html += items.map(item => {
          const dateStr = new Date(item.completedAt).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
          });
          return `
            <div class="archive-item">
              <div>
                <div>${item.text}</div>
                ${item.time ? `<div class="task-time">🕒 Было на: ${item.time}</div>` : ''}
              </div>
              <div class="archive-date">✓ ${dateStr}</div>
            </div>
          `;
        }).join('');
        html += `</div>`;
      }
      list.innerHTML = html;
    }

    // Первоначальный рендер
    renderTasks();
    renderNotes();
    renderMemos();
  </script>
</body>
</html>
